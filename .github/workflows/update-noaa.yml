name: Niño 3.4 monitor frissítése és közzététele

on:
  push:
    branches: [main]
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Repository letöltése
        uses: actions/checkout@v4

      - name: Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: NOAA-adatok frissítése
        run: python update_data.py

      - name: Új adat mentése a repositoryba
        run: |
          if git diff --quiet -- data.json; then
            echo "Nincs új NOAA-adat."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "NOAA Niño 3.4 adatok frissítése"
            git push
          fi

      - name: GitHub Pages beállítása
        uses: actions/configure-pages@v5

      - name: Weboldal csomagolása
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Közzététel GitHub Pages-re
        id: deployment
        uses: actions/deploy-pages@v4
